config-version = 2
start-at-login = true

persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', 'v', 'r']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
key-mapping.preset = 'qwerty'
accordion-padding = 60

after-startup-command = [
    'exec-and-forget borders active_color=0xfff0f1f1 inactive_color=0xff707172 width=5.0'
]
exec-on-workspace-change = ['/Users/zac/.dotfiles/home/.config/aerospace/on-workspace-change.sh']

[gaps]
inner.horizontal = 10
inner.vertical =   10
outer.bottom = [{ monitor."AORUS FO48U" = 120 }, 10]
outer.top = [{ monitor."AORUS FO48U" = 340 }, 10]
outer.left = [{ monitor."AORUS FO48U" = 10 }, 10]
outer.right = [{ monitor."AORUS FO48U" = 10 }, 10]

# See https://nikitabobko.github.io/AeroSpace/guide#exec-env-vars
[exec]                   # Again, you don't need to copy all config sections to your config.
inherit-env-vars = true  # If you don't touch "exec" section,
[exec.env-vars]          # it will fallback to "default-config.toml"
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

# - Modifiers.      cmd, alt, ctrl, shift
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right
[mode.main.binding]
cmd-h = [] # disable hide

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
ctrl-alt-shift-l = 'focus left'
ctrl-alt-shift-j = 'focus down'
ctrl-alt-shift-k = 'focus up'
ctrl-alt-shift-semicolon = 'focus right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# communications workspace
ctrl-alt-shift-1 = ['workspace 1']
ctrl-alt-shift-a = ['workspace 1']
cmd-ctrl-alt-shift-1 = 'move-node-to-workspace 1'
# browser workspace
ctrl-alt-shift-2 = 'workspace 2'
ctrl-alt-shift-s = 'workspace 2'
cmd-ctrl-alt-shift-2 = 'move-node-to-workspace 2'

# numbered workspaces and homerow aliesses
ctrl-alt-shift-3 = 'workspace 3'
ctrl-alt-shift-d = 'workspace 3'
cmd-ctrl-alt-shift-3 = 'move-node-to-workspace 3'
ctrl-alt-shift-4 = 'workspace 4'
ctrl-alt-shift-f = 'workspace 4'
cmd-ctrl-alt-shift-4 = 'move-node-to-workspace 4'
ctrl-alt-shift-5 = 'workspace 5'
ctrl-alt-shift-g = 'workspace 5'
cmd-ctrl-alt-shift-5 = 'move-node-to-workspace 5'
ctrl-alt-shift-6 = 'workspace 6'
cmd-ctrl-alt-shift-6 = 'move-node-to-workspace 6'
ctrl-alt-shift-7 = 'workspace 7'
cmd-ctrl-alt-shift-7 = 'move-node-to-workspace 7'
ctrl-alt-shift-8 = 'workspace 8'
cmd-ctrl-alt-shift-8 = 'move-node-to-workspace 8'

# video workspace
ctrl-alt-shift-v = 'workspace v'
cmd-ctrl-alt-shift-v = 'move-node-to-workspace v'

# r workspace
ctrl-alt-shift-r = ['workspace r']
cmd-ctrl-alt-shift-r = ['move-node-to-workspace r']

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
alt-tab = 'workspace-back-and-forth'
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-backspace = 'mode service'

[workspace-to-monitor-force-assignment]
    1 = 'DELL U2723QE'
    2 = 'LG ULTRAWIDE \(2\)'
    3 = 'LG ULTRAWIDE \(1\)'
    4 = 'LG ULTRAWIDE \(1\)'

# browsers to browser workspace
[[on-window-detected]]
if.window-title-regex-substring = 'Extension: \(Bitwarden Password Manager\) - Bitwarden'
run = ['layout floating']
check-further-callbacks = false
[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
if.window-title-regex-substring = 'Picture-in-Picture'
run = ['layout floating']
check-further-callbacks = false
[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = ['move-node-to-workspace 2']
[[on-window-detected]]
if.app-id = "company.thebrowser.Browser"
run = ['move-node-to-workspace 2']
[[on-window-detected]]
if.app-id = "com.google.Chrome"
run = ['move-node-to-workspace 2']
[[on-window-detected]]
if.app-id = "com.apple.Safari"
run = ['move-node-to-workspace 2']
[[on-window-detected]]
if.app-id = "com.microsoft.edgemac"
run = ['move-node-to-workspace 2']

# communications
[[on-window-detected]]
if.app-id = "com.hnc.Discord"
run = ['move-node-to-workspace 1']
[[on-window-detected]]
if.app-id = "com.apple.MobileSMS"
run = ['move-node-to-workspace 1']
[[on-window-detected]]
if.app-id = "com.tinyspeck.slackmacgap"
run = ['move-node-to-workspace 1']
[[on-window-detected]]
if.app-id = "com.apple.mail"
run = ['move-node-to-workspace 1']
[[on-window-detected]]
if.app-id = "com.microsoft.Outlook"
run = ['move-node-to-workspace 1']

# video
[[on-window-detected]]
if.app-id = "tv.plex.desktop"
run = ['move-node-to-workspace v']

[[on-window-detected]]
if.window-title-regex-substring = "wezterm Configuration Error"
run = ['layout floating']
check-further-callbacks = false
[[on-window-detected]]
if.app-id = "com.github.wez.wezterm"
run = ["move-node-to-workspace 3"]

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout

shift-j = ['join-with down', 'mode main']
shift-k = ['join-with up', 'mode main']
shift-l = ['join-with left', 'mode main']
shift-semicolon = ['join-with right', 'mode main']

